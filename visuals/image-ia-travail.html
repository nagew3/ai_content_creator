<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 627px; background: #f7f9fc; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

  .card {
    width: 1200px;
    height: 627px;
    background: #f7f9fc;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px 96px 64px 120px;
  }

  /* Barre gauche navy */
  .left-bar {
    position: absolute;
    left: 0; top: 0;
    width: 10px; height: 100%;
    background: #0f2744;
  }

  /* Cercles décoratifs discrets */
  .circle-1 {
    position: absolute;
    top: -180px; right: -180px;
    width: 600px; height: 600px;
    border-radius: 50%;
    border: 1.5px solid #dce6f0;
  }
  .circle-2 {
    position: absolute;
    top: -100px; right: -100px;
    width: 380px; height: 380px;
    border-radius: 50%;
    border: 1.5px solid #dce6f0;
  }
  .circle-3 {
    position: absolute;
    bottom: -60px; left: 80px;
    width: 180px; height: 180px;
    border-radius: 50%;
    border: 1.5px solid #dce6f0;
  }

  .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #f5963e;
    margin-bottom: 32px;
  }

  .line-navy {
    font-size: 52px;
    font-weight: 800;
    color: #0f2744;
    line-height: 1.15;
    margin-bottom: 4px;
  }

  .accent {
    color: #f5963e;
  }

  .stat-block {
    margin-top: 32px;
    padding: 16px 24px;
    background: #0f2744;
    display: inline-block;
    border-radius: 8px;
  }

  .stat-text {
    font-size: 20px;
    font-weight: 600;
    color: #ffffff;
  }

  .stat-text span {
    color: #f5963e;
    font-weight: 800;
  }

  .logo {
    position: absolute;
    bottom: 36px;
    right: 64px;
    height: 48px;
    opacity: 0.85;
  }

  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 4px;
    background: linear-gradient(to right, #0f2744 0%, #f5963e 100%);
  }

  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: #f5963e;
    border-radius: 50%;
    margin-right: 10px;
    vertical-align: middle;
    position: relative;
    top: -2px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="left-bar"></div>
  <div class="circle-1"></div>
  <div class="circle-2"></div>
  <div class="circle-3"></div>

  <div class="label"><span class="dot"></span>IA & Travail · 2026</div>

  <div class="line-navy">L'IA ne va pas prendre ton travail.</div>
  <div class="line-navy">Quelqu'un qui <span class="accent">utilise l'IA</span></div>
  <div class="line-navy">va le faire à ta place.</div>

  <div class="stat-block">
    <div class="stat-text">Il gagnera le même salaire. <span>En 3× moins de temps.</span></div>
  </div>

  <img class="logo" src="logo.png" alt="GF Logo">
  <div class="bottom-bar"></div>
</div>
</body>
</html>
