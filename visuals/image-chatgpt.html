<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 627px; background: #0f2744; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }

  .card {
    width: 1200px;
    height: 627px;
    background: #0f2744;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 64px 96px;
  }

  /* Cercles décoratifs — derrière le texte */
  .circle-1 {
    position: absolute;
    top: -140px; right: -140px;
    width: 520px; height: 520px;
    border-radius: 50%;
    border: 56px solid #1a3a6e;
    z-index: 0;
  }
  .circle-2 {
    position: absolute;
    bottom: -90px; left: -90px;
    width: 300px; height: 300px;
    border-radius: 50%;
    border: 36px solid #1a3a6e;
    z-index: 0;
  }
  .circle-3 {
    position: absolute;
    top: -60px; right: -60px;
    width: 280px; height: 280px;
    border-radius: 50%;
    border: 2px solid #2a4a7e;
    z-index: 0;
  }

  .content {
    position: relative;
    z-index: 1;
  }

  .label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #f5963e;
    margin-bottom: 36px;
  }

  .line-white {
    font-size: 54px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.15;
    margin-bottom: 4px;
  }

  .line-orange {
    font-size: 54px;
    font-weight: 800;
    color: #f5963e;
    line-height: 1.15;
    margin-bottom: 4px;
  }

  .line-sub {
    font-size: 22px;
    font-weight: 400;
    color: #7a9abb;
    margin-top: 28px;
    font-style: italic;
  }

  .logo {
    position: absolute;
    bottom: 36px;
    right: 64px;
    height: 48px;
    filter: brightness(0) invert(1);
    opacity: 0.75;
  }

  .bottom-bar {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 4px;
    background: #f5963e;
  }

  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: #f5963e;
    border-radius: 50%;
    margin-right: 10px;
    vertical-align: middle;
    position: relative;
    top: -2px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="circle-1"></div>
  <div class="circle-2"></div>
  <div class="circle-3"></div>

  <div class="content">
    <div class="label"><span class="dot"></span>IA & Productivité · 2026</div>
    <div class="line-white">ChatGPT ne vous a pas déçu.</div>
    <div class="line-white">Vous ne lui avez pas posé</div>
    <div class="line-orange">les bonnes questions.</div>
    <div class="line-sub">Et personne ne vous a appris à le faire.</div>
  </div>

  <img class="logo" src="logo.png" alt="GF Logo">
  <div class="bottom-bar"></div>
</div>
</body>
</html>
